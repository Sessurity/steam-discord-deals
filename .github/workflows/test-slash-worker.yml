name: Test ZHAXO slash commands
on:
  pull_request:
    paths: ['worker/**', '.github/workflows/test-slash-worker.yml']
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/test-slash-worker.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd worker && node --test
