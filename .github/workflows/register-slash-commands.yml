name: Register ZHAXO slash commands
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Discord Application ID (General Information)'
        required: true
        type: string
      guild_id:
        description: 'Discord Server ID (Copy Server ID)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register guild commands
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APP_ID: ${{ inputs.app_id }}
          DISCORD_GUILD_ID: ${{ inputs.guild_id }}
        run: cd worker && node register-commands.mjs
