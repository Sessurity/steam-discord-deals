name: Steam discounts → Discord

on:
  schedule:
    - cron: '0 8 * * 0-6'
      timezone: 'Europe/Kyiv'
    - cron: '17 * * * *'
      timezone: 'Europe/Kyiv'
    # Резервні спроби після 08:00 — без дублікатів завдяки last_post_date.
    - cron: '23,43 8 * * *'
      timezone: 'Europe/Kyiv'
    - cron: '13 9 * * *'
      timezone: 'Europe/Kyiv'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Режим запуску: щоденний звіт або очищення'
        type: choice
        options:
          - daily
          - cleanup
        default: daily
      force_send:
        description: 'Відправити повторно, навіть якщо сьогодні вже був звіт'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: steam-discord-deals
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Діагностика запуску
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          echo "GitHub event: $EVENT_NAME"
          echo "Cron: ${SCHEDULE_EXPRESSION:-ручний запуск}"
          date -u '+UTC: %Y-%m-%d %H:%M'
          TZ=Europe/Kyiv date '+Kyiv: %Y-%m-%d %H:%M'
      - name: Запустити модульні тести
        run: python -m unittest discover -s test -v
      - name: ZHAXO — публікація, очищення та міграція старого Webhook
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          # Тимчасово використовується виключно для видалення старих Webhook-повідомлень.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' && '1' || '0' }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'cleanup' && 'cleanup' || github.event_name == 'schedule' && github.event.schedule == '17 * * * *' && 'cleanup' || 'daily' }}
        run: python steam_deals.py
      - name: Зберегти стан для порівняння з попереднім днем
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Steam deals snapshot [skip ci]'
            git push
          fi
