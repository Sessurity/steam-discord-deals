name: Remove old public ZHAXO command replies

on:
  # Once this fix reaches main, prune only the obsolete slash-command messages.
  # Never touch the daily Steam report or current ephemeral responses.
  push:
    branches: [main]
    paths: ['worker/src/index.js']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list matching replies; do not delete'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: zhaxo-legacy-command-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove only previous public slash-command answers
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python worker/cleanup_legacy_replies.py
