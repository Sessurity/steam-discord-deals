name: Steam discounts → Discord

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Kyiv'
    - cron: '15 * * * *'
      timezone: 'Europe/Kyiv'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Відправити повторно, навіть якщо сьогодні вже був звіт'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: steam-discord-deals
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Запустити модульні тести
        run: python -m unittest discover -s test -v
      - name: Перевірити знижки та надіслати Discord-повідомлення
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '15 * * * *' && 'cleanup' || 'daily' }}
        run: python steam_deals.py
      - name: Зберегти стан для порівняння з попереднім днем
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Steam deals snapshot [skip ci]'
            git push
          fi
