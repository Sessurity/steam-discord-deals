name: Discord Steam Commands

on:
  schedule:
    - cron: '2/5 * * * *'
      timezone: 'Europe/Kyiv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-discord-commands
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test commands
        run: python -m unittest discover -s test -v
      - name: Read Discord commands and send replies
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_ALLOWED_USER_IDS: ${{ vars.DISCORD_ALLOWED_USER_IDS }}
        run: python discord_commands.py
      - name: Persist processed message cursor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/command_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Discord command cursor [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
